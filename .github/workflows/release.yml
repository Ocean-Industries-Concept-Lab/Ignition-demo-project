name: Release

# Publishes OpenBridge_content_<version>.zip, which the OpenBridge module bundles, and
# OpenBridge_demo_<version>.zip, the full demo as a project the Gateway can import directly.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v1.0.0"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Test the catalog build
        run: python3 -I scripts/test_build_catalog.py

      - name: Build release assets
        run: |
          set -euo pipefail
          python3 -I scripts/build_catalog.py --version "$VERSION" --out dist
          unzip -l "dist/OpenBridge_content_${VERSION}.zip" | awk '{print $4}' | grep -qx 'catalog.json'
          unzip -l "dist/OpenBridge_demo_${VERSION}.zip" | awk '{print $4}' | grep -qx 'project.json'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            "dist/OpenBridge_content_${VERSION}.zip" \
            "dist/OpenBridge_demo_${VERSION}.zip" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            ${{ inputs.prerelease && '--prerelease' || '' }}
